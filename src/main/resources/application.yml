# Application identity populated at build time by Maven resource filtering
application:
  title: ${project.name}
  version: ${project.version}
server:
  port: ${SERVER_PORT:8086}

spring:
  profiles:
    active: ${QTMDB_ENV:sviluppo}
  sql:
    init:
      #FIXME Francesco dovresti passare per liquibase o avere un altro sistema
      mode: always
  jpa:
    open-in-view: false
    properties:
      hibernate:
        '[format_sql]': true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          # FIXME Francesco: issuer e JWK derivano dalla stessa realm-url; mantenere un solo punto di composizione Keycloak.
          issuer-uri: ${app.keycloak.realm-url}
          jwk-set-uri: ${APP_KEYCLOAK_JWK_SET_URI:${app.keycloak.realm-url}/protocol/openid-connect/certs}
  mail:
    host: smtp.gmail.com
    port: 587
    username: francesco.tripodi@gmail.com
    password: ayekcfnurmmpwrxd
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com


app:
  cors:
    # FIXME Francesco: verificare le origini per ambiente e rimuovere il valore vuoto finale dalla lista di default.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8086,}
  keycloak:
    server-url: ${APP_KEYCLOAK_SERVER_URL:http://localhost:8085}
    # FIXME Francesco: mantenere realm-code, realm-url e token-url composti dalla configurazione Keycloak comune.
    realm-code: ${APP_KEYCLOAK_REALM_CODE:QTM}
    realm-url: ${app.keycloak.server-url}/realms/${app.keycloak.realm-code}
    token-url: ${APP_KEYCLOAK_TOKEN_URL:${app.keycloak.realm-url}/protocol/openid-connect/token}

    client-id: ${APP_KEYCLOAK_CLIENT_ID:postman-client}
    client-secret: ${APP_KEYCLOAK_CLIENT_SECRET:}
    grant-type: ${APP_KEYCLOAK_GRANT_TYPE:password}
    admin-client-id: ${APP_KEYCLOAK_ADMIN_CLIENT_ID:admin-cli-helper}
    # FIXME Francesco: secret senza default cablato; deve arrivare esclusivamente dall ambiente.
    admin-client-secret: ${APP_KEYCLOAK_ADMIN_CLIENT_SECRET:}
    admin-grant-type: ${APP_KEYCLOAK_ADMIN_GRANT_TYPE:client_credentials}
    admin-username: ${APP_KEYCLOAK_ADMIN_USERNAME:${KEYCLOAK_ADMIN:${KC_BOOTSTRAP_ADMIN_USERNAME:}}}
    admin-password: ${APP_KEYCLOAK_ADMIN_PASSWORD:${KEYCLOAK_ADMIN_PASSWORD:${KC_BOOTSTRAP_ADMIN_PASSWORD:}}}
    admin-user-realm: ${APP_KEYCLOAK_ADMIN_USER_REALM:master}
    client-association-attribute: ${APP_KEYCLOAK_CLIENT_ASSOCIATION_ATTRIBUTE:qtm-client-id}
  tenants:
    # FIXME Francesco: base URL tenant centralizzata; valutare un dominio dedicato senza path /dashboard.
    base-url: ${APP_TENANTS_BASE_URL:http://localhost:4201}
    dashboard-url: ${app.tenants.base-url}/dashboard
    default-tenant-app-url: ${APP_TENANTS_DEFAULT_TENANT_APP_URL:${app.tenants.dashboard-url}}
    mappings:
      - client-code: app-cliente-A
        client-name: app-cliente-A
        # FIXME Francesco: mapping client A derivato dalla dashboard-url comune; evitare URL duplicati.
        tenant-app-url: ${APP_TENANTS_CLIENT_A_URL:${app.tenants.dashboard-url}}
        enabled: true
      - client-code: app-cliente-B
        client-name: app-cliente-B
        # FIXME Francesco: mapping client B derivato dalla dashboard-url comune; evitare URL duplicati.
        tenant-app-url: ${APP_TENANTS_CLIENT_B_URL:${app.tenants.dashboard-url}}
        enabled: true
  ticket:
    # FIXME Francesco: URL interno configurabile per il deploy Docker; il default mantiene l'avvio locale corrente.
    base-url: ${APP_TICKET_BASE_URL:http://localhost:8084/api/ticket}

# Proprieta custom per OTP Twilio Verify
qtm:
  otp:
    twilio:
      enabled: ${QTM_OTP_TWILIO_ENABLED:true}
      auto-send-on-onboarding: ${QTM_OTP_TWILIO_AUTO_SEND_ON_ONBOARDING:true}
      base-url: ${QTM_OTP_TWILIO_BASE_URL:https://verify.twilio.com/v2}
      service-sid: ${QTM_OTP_TWILIO_SERVICE_SID:${TWILIO_VERIFY_SERVICE_SID:}}
      account-sid: ${QTM_OTP_TWILIO_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:}}
      auth-token: ${QTM_OTP_TWILIO_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:}}
      api-key: ${QTM_OTP_TWILIO_API_KEY:${TWILIO_API_KEY:}}
      api-secret: ${QTM_OTP_TWILIO_API_SECRET:${TWILIO_API_SECRET:}}
      default-channel: ${QTM_OTP_TWILIO_DEFAULT_CHANNEL:sms}

