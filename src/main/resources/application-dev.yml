spring:
  sql:
    init:
      #FIXME Francesco passare per liquibase
      mode: never
  datasource:
    # FIXME Francesco: URL DB componibile; DB_NAME usa il realm-code solo come fallback.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:qtmdev.quicare.com}:${DB_PORT:3306}/${DB_NAME_PREFIX:qtmdashboard_}${DB_NAME:${APP_KEYCLOAK_REALM_CODE:}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:dago}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Porta del client A (usata per parametrizzazione liquibase o app)
portClientA: ${PORT_CLIENT_A:80}
app:
  keycloak:
    # Default locale per esecuzione da Eclipse; resta possibile fare override via environment.
    server-url: ${APP_KEYCLOAK_SERVER_URL:http://localhost:8085}
    realm-code: ${APP_KEYCLOAK_REALM_CODE:QTM}

# Il database usa DB_HOST/DB_PORT e DB_NAME, con fallback al realm corrente.
DB_NAME_PREFIX: qtmdashboard_
SPRING_DATASOURCE_USERNAME: root
SPRING_DATASOURCE_PASSWORD: dago
#PRING_DATASOURCE_PASSWORD: qtm@dev#pwd33
#APP_KEYCLOAK_REALM_CODE: Lecigimon
#APP_KEYCLOAK_SERVER_URL: https://auth.qtmdev.quicare.com
# FIXME Francesco: logging di autenticazione temporaneo, limitato al profilo dev.
logging:
  level:
    com.qtm.dashboard.auth: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.client: DEBUG
    org.keycloak: DEBUG

# Configurazione OTP Twilio per profilo dev
qtm:
  otp:
    twilio:
      enabled: ${QTM_OTP_TWILIO_ENABLED:true}
      auto-send-on-onboarding: ${QTM_OTP_TWILIO_AUTO_SEND_ON_ONBOARDING:true}
      base-url: ${QTM_OTP_TWILIO_BASE_URL:https://verify.twilio.com/v2}
      service-sid: ${QTM_OTP_TWILIO_SERVICE_SID:${TWILIO_VERIFY_SERVICE_SID:}}
      account-sid: ${QTM_OTP_TWILIO_ACCOUNT_SID:${TWILIO_ACCOUNT_SID:}}
      auth-token: ${QTM_OTP_TWILIO_AUTH_TOKEN:${TWILIO_AUTH_TOKEN:}}
      api-key: ${QTM_OTP_TWILIO_API_KEY:${TWILIO_API_KEY:}}
      api-secret: ${QTM_OTP_TWILIO_API_SECRET:${TWILIO_API_SECRET:}}
      default-channel: ${QTM_OTP_TWILIO_DEFAULT_CHANNEL:sms}
