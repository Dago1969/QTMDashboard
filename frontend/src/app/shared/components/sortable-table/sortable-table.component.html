<div class="sortable-table-card">
  <div class="table-responsive asl-table-wrapper">
    <table class="search-table asl-search-table hospital-search-table">
      <thead>
        <tr>
          <th *ngFor="let col of columns" (click)="toggleSort(col)" [class.sortable]="col.sortable">
            <span class="col-label">{{ col.label }}</span>
            <span class="sort-indicator">{{ sortIndicator(col) }}</span>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of data; trackBy: trackByIndex">
          <td *ngFor="let col of columns">
            <ng-container *ngIf="!col.customTemplate">{{ row[col.key] ?? '-' }}</ng-container>
            <ng-container *ngIf="col.customTemplate" [ngTemplateOutlet]="col.customTemplate" [ngTemplateOutletContext]="{ $implicit: row }"></ng-container>
          </td>
        </tr>
        <tr *ngIf="!data || data.length === 0">
          <td class="asl-empty-cell" [attr.colspan]="columns.length">Nessun elemento</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="asl-table-footer" *ngIf="totalItems > 0">
    <div class="search-pagination asl-pagination">
      <span class="asl-pagination-text">Pag {{ page + 1 }} di {{ totalPages }}</span>
      <div class="asl-pagination-buttons">
        <button class="btn btn-outline asl-pagination-button" type="button" (click)="prevPage()" [disabled]="page <= 0">&lt;</button>
        <button class="btn btn-outline asl-pagination-button" type="button" (click)="nextPage(totalPages)" [disabled]="page + 1 >= totalPages">&gt;</button>
      </div>
    </div>
  </div>
</div>
