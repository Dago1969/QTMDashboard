user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  300;
    server {
        listen       80;
        server_name  localhost;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        location / {
            try_files $uri $uri/ /index.html;
        }
        # Proxy /api/ticket requests to the Ticket service to avoid hitting the Dashboard backend
        # Adjust the upstream host if your ticket service is internal (e.g. http://qtm-ticket-backend:8086)
        location /api/ticket/ {
            proxy_pass https://ticket.qtmdev.quicare.com/api/ticket/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 200M;
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
            proxy_request_buffering off;
        }
    }
}
